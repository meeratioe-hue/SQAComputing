<!-- Create the HTML to show the iLoveFooty form. You must use table and form elements. -->

<html> <!-- lines 5 to 12 is to make the width of the first column wider-->
    <head>
        <style>
            .firstcolumn {
                width: 100px;
            }
        </style>
    </head>

<form action =""method = "POST"> <!--can be POST or GET-->
    <table border = "1">
        <tr><td class="firstcolumn">Title </td><td>
        <select name="title">
            <option value = "footy">iLoveFooty</option>
            <option value = "rugby">iLoveRugby</option>
            <option value = "bball">iLoveBBall</option>
        </select>   
        </td></tr>
        
        <tr><td>Review </td><td>
        <textarea rows="5" cols = "20" name = "review">
        </textarea>
        </td></tr>

        <tr><td>Rating </td><td>
        <select name="rating">
            <option value = "1">1</option>
            <option value = "2">2</option>
            <option value = "3">3</option>
            <option value = "4">4</option>
            <option value = "5">5</option>
        </select>
        </td></tr>

        <tr><td colspan="2">
            <center>
                <input type = "submit">
            </center>
        </td></tr>
    </table>
</form>

</html>
